name: neet_paper_test
description: "A production-quality offline-first MCQ examination platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  provider: ^6.1.2

  # Dependency Injection
  get_it: ^7.7.0

  # Routing
  go_router: ^14.2.0

  # Database (Offline-first)
  drift: ^2.19.0
  drift_flutter: ^0.2.0
  sqlite3: ^2.4.3

  # Data Parsing
  excel: ^4.0.5
  file_picker: ^8.0.0+1
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5

  # UI & Analytics
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  logger: ^2.3.0

  # Functional programming & Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.9
  drift_dev: ^2.19.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
